name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      VITE_API_BASE_URL: http://127.0.0.1:3111
      VITE_PHOTO_CDN_BASE_URL: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      # 각 설정은 루프백 Vite와 가짜 API 응답을 사용한다.
      - name: Home on desktop and mobile
        run: npx --no-install playwright test --config=playwright.main.config.ts --forbid-only
      - name: Search, navigation and calendar
        run: npx --no-install playwright test --config=playwright.sidebar.config.ts --forbid-only
      - name: Legal pages
        run: npx --no-install playwright test --config=playwright.legal.config.ts --forbid-only
      - name: Preserve Playwright reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
